spring.application.name=docksystem_erp

server.port=8080
security.enabled=${SECURITY_ENABLED:true}


erp.base-url=http://localhost:8080/api/erp/v1


# MySQL 8.4 (포트 3307). Spring Boot 3.5는 MySQL 8.0 이상이 필요해서 5.5(3306)는 쓰지 않는다
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/dock_system_erp?rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME:dock}
spring.datasource.password=${DB_PASSWORD:dock}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

##h2
#spring.datasource.url=jdbc:h2:mem:docksystem_erp
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.h2.console.enabled=true

#h2,mysql common
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#jwt & auth key
jwt.secret=${JWT_SECRET}
# 로그인 유지 시간 (기본 8시간 = 근무 1교대)
jwt.expiration=${JWT_EXPIRATION_MS:28800000}
jwt.refresh=604800000


# 최초 실행 시 사용자가 한 명도 없으면 아래 계정으로 관리자를 만든다 (운영에서는 환경변수로 반드시 변경)
app.init-admin.user-id=${INIT_ADMIN_ID:admin}
app.init-admin.password=${INIT_ADMIN_PASSWORD:1234}

# 외부 API 키 (홈 화면 뉴스 · 날씨). 비워 두면 그 칸만 비어 보인다
naver.client-id=${NAVER_CLIENT_ID:}
naver.client-secret=${NAVER_CLIENT_SECRET:}
weather.api-key=${WEATHER_API_KEY:}

# 비밀값은 깃에 올리지 않는 local.properties(이 폴더)에 둔다. local.properties.example 참고
spring.config.import=optional:file:./local.properties

# 매장 영업 시뮬레이터가 부르는 매장 POS API (개발 · 시험용)
pos.api-url=${POS_API_URL:http://localhost:8081/api/pos/v1}
