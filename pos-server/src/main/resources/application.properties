spring.application.name=cafeon_pos

# 매장 POS 서버 (본사 ERP와 별개 시스템). 매장 기기에서 쓰는 화면이 이 서버를 부른다.
server.port=8081

# POS 자체 DB. 판매 · 마감은 여기에 먼저 저장하고, 본사로 보낼 것은 전송 대기열에 쌓는다.
# (DB 이름은 예전 MES DB를 그대로 쓴다: 계정 권한이 이 DB에만 있음)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/cafeon_pos
spring.datasource.username=${DB_USERNAME:dock}
spring.datasource.password=${DB_PASSWORD:dock}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# 본사 ERP 데이터 수집 API (매장 연동 키 X-Store-Key로 통신)
hq.ingest-url=${HQ_INGEST_URL:http://localhost:8080/api/ingest/v1}
# 본사로 보내기 / 본사에서 받기 주기 (밀리초)
pos.sync.send-ms=5000
pos.sync.pull-ms=20000

# POS 기기 로그인 토큰 (본사 ERP 로그인과 별개)
pos.jwt.secret=${POS_JWT_SECRET}
pos.jwt.days=7

# 일 마감 시재: 준비금 (본사 ERP와 같은 값)
pos.cash-float=200000

# 매장 POS 화면 주소
pos.front-origins=http://localhost:3000,http://127.0.0.1:3000

# 비밀값은 깃에 올리지 않는 local.properties(이 폴더)에 둔다. local.properties.example 참고
spring.config.import=optional:file:./local.properties
